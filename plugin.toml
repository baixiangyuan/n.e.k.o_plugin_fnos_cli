[plugin]
id = "fnos_cli"
name = "fnOS 管理"
description = "通过 fnos-cli 管理 fnOS（飞牛 NAS）设备：系统信息、存储、文件、Docker、下载任务、应用、日志、监控、网络、用户与百度网盘。所有命令都走 Skill 包内固定版本的启动器，首次运行自动下载并校验对应平台的原生 CLI。"
short_description = "Manage fnOS devices through fnos-cli: system, storage, files, Docker, downloads, apps, logs, monitoring, network, users, and Baidu Netdisk."
keywords = [
    "fnos", "fnOS", "飞牛", "飞牛NAS", "nas", "NAS", "storage", "存储", "file", "文件",
    "docker", "download", "下载", "app", "应用中心", "log", "日志", "monitor", "监控",
    "network", "网络", "ssh", "user", "用户", "百度网盘", "baidu", "netdisk", "photo", "相册",
]
version = "0.5.1"
type = "plugin"
entry = "plugin.plugins.fnos_cli.plugin:FnOsCliPlugin"

[plugin.author]
name = "fnos-cli skill"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "locales"

[plugin_runtime]
enabled = true
auto_start = false
timeout = 60
startup_failure = "warn"

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "fnOS 管理"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "config:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "接入与授权"
entry = "docs/quickstart.md"
permissions = ["state:read"]

[fnos_cli]
# 默认连接目标。host 为空表示未设置，需要在面板或入口里显式指定。
host = ""
port = 5666
scheme = "auto"
# profile 名：仅允许 ASCII 字母、数字、_ - .
profile = "home"
# 高危写操作是否需要显式确认。true 时入口要求 confirmed=true 才执行。
require_confirmation = true
# CLI 可执行文件最长执行秒数。
timeout_seconds = 300
# 工作目录。留空则使用插件状态目录下的 run 目录。
working_dir = ""
# 是否允许把命令输出原样返回给调用方（LLM/Agent 会看到设备返回内容）。
return_raw_output = false
